<form method="post" action="/export">
  <input type="hidden" name="csrf" value="${csrf_token}">
  <fieldset class="device-select">
    <legend>Devices (none selected = all)</legend>
    <table class="device-select-table">
      <thead><tr><th>Select</th><th>Device</th></tr></thead>
      <tbody>${devices}</tbody>
    </table>
  </fieldset>
  <p>
    <label>From (UTC, inclusive) <input type="datetime-local" name="start" step="1"></label>
    <label>To (UTC, exclusive) <input type="datetime-local" name="end" step="1"></label>
    <label><input type="checkbox" name="include_configs" value="1" checked> sanitized configurations</label>
    <button>Create export</button>
  </p>
</form>
<ul>${files}</ul>
