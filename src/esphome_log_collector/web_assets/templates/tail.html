<div class="tail-controls">
  <form method="get" action="/tail">
    Device <select name="device"><option value="">all</option>${devices}</select>
    Level <select name="level"><option value="">any</option>${levels}</select>
    Type <select name="type"><option value="">any</option>${types}</select>
    Text <input name="q" value="${query}">
    <button>Tail</button>
  </form>
  <p>Stream: <strong id="tail-state" aria-live="polite">Connecting…</strong></p>
</div>
<div id="tail-rows" class="terminal" data-stream-url="${stream_url}">${rows}</div>
<script src="/static/tail.js" defer></script>
