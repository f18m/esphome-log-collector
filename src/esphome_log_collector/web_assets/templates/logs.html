<form method="get" action="/logs">
  Device <select name="device"><option value="">all</option>${devices}</select>
  Level <select name="level"><option value="">any</option>${levels}</select>
  Type <select name="type"><option value="">any</option>${types}</select>
  From <input name="start" value="${start}" placeholder="2025-01-31T12:00:00Z">
  To <input name="end" value="${end}">
  Text <input name="q" value="${query}">
  <button>Search</button>
</form>
<p>${pager}</p>
<table>
  <thead><tr><th>Time (UTC)</th><th>Device</th><th>Level</th><th>Component</th><th>Type</th><th>Line (ANSI removed)</th></tr></thead>
  <tbody>${rows}</tbody>
</table>
<p>${pager}</p>
