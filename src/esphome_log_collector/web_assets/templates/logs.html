<div class="log-controls">
  <form method="get" action="/logs">
    Device <select name="device"><option value="">all</option>${devices}</select>
    Level <select name="level"><option value="">any</option>${levels}</select>
    Type <select name="type"><option value="">any</option>${types}</select>
    From <input name="start" value="${start}" placeholder="2025-01-31T12:00:00Z">
    To <input name="end" value="${end}">
    Text <input name="q" value="${query}">
    <button>Search</button>
  </form>
  <div class="font-controls" role="group" aria-label="Log font size">
    <button type="button" data-font-target="logs" data-font-step="-1" aria-label="Decrease log font size" title="Decrease log font size">A−</button>
    <button type="button" data-font-target="logs" data-font-step="1" aria-label="Increase log font size" title="Increase log font size">A+</button>
  </div>
  <p>${pager}</p>
</div>
<div class="log-table-scroll">
  <table class="log-table">
    <thead><tr><th>Time (UTC)</th><th>Device</th><th>Level</th><th>Component</th><th>Type</th><th>Line (ANSI removed)</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
</div>
