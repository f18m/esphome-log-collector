<div class="log-controls">
  <form method="get" action="/logs">
    Device <select name="device"><option value="">all</option>${devices}</select>
    Log Level <select name="level"><option value="">any</option>${levels}</select>
    Type <select name="type"><option value="">any</option>${types}</select>
    <div class="date-range">
      <label>From (UTC, inclusive) <input type="datetime-local" name="start" step="1" value="${start}"></label>
      <label>To (UTC, exclusive) <input type="datetime-local" name="end" step="1" value="${end}"></label>
    </div>
    <label class="text-filter">Text <input name="q" value="${query}"></label>
    <button>Search</button>
  </form>
  <div class="control-toolbar">
    <p>${pager}</p>
    <div class="terminal-actions">
      <button type="button" class="copy-button" data-copy-target="logs-rows" aria-describedby="logs-copy-status">Copy</button>
      <button type="button" class="copy-button" data-download-target="logs-rows" data-download-filename="logs.txt" aria-describedby="logs-download-status">Download</button>
      <span id="logs-copy-status" class="copy-status" aria-live="polite"></span>
      <span id="logs-download-status" class="copy-status" aria-live="polite"></span>
      <span class="font-controls" role="group" aria-label="Log font size">
        <button type="button" data-font-target="logs" data-font-step="-1" aria-label="Decrease log font size" title="Decrease log font size">A−</button>
        <button type="button" data-font-target="logs" data-font-step="1" aria-label="Increase log font size" title="Increase log font size">A+</button>
      </span>
    </div>
  </div>
</div>
<div id="logs-rows" class="terminal logs-terminal">${rows}</div>
