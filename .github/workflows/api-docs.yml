name: API documentation

on:
  push:
    branches: [main]
    paths:
      - openapi.json
      - src/**
      - requirements.txt
      - pyproject.toml
      - .github/workflows/api-docs.yml
  pull_request:
    branches: [main]
    paths:
      - openapi.json
      - src/**
      - requirements.txt
      - pyproject.toml
      - .github/workflows/api-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install API schema dependencies
        run: python -m pip install fastapi==0.143.0 uvicorn==0.40.0 PyYAML==6.0.3

      - name: Check for OpenAPI drift
        run: PYTHONPATH=src python -m esphome_log_collector.openapi_cli --check

      - name: Generate static API reference
        run: |
          mkdir -p _site
          npx --yes @redocly/cli@1.34.5 build-docs openapi.json --output _site/index.html --disableGoogleFont
          cp openapi.json _site/openapi.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
